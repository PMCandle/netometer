name: Build Neto Meter EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller psutil
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NetoMeter netometer.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetoMeter-exe
          path: dist/NetoMeter.exe
